<!DOCTYPE html>
<html>
<head>
    <title>SmartPrep - Success</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f8f8;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        
        .navbar {
            background-color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        .navbar a {
            margin-left: 25px;
            color: black;
            font-weight: bold;
        }

        /* Success Section */
        .success-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 50px;
            border-radius: 10px;
            width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .box h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .box p {
            color: #555;
            margin-bottom: 15px;
        }

        .box button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .box button:hover {
            background-color: #333;
        }

    </style>
</head>

<body>

   
    <div class="navbar">
        <h2>SmartPrep</h2>
        <div>
            <a href="samplefront.html">Home</a>
            <a href="samplelogin.html">Login</a>
            <a href="sampledashboard.html">Dashboard</a>
        </div>
    </div>

    
    <div class="success-section">
        <div class="box">
            <h2>Success!</h2>
            <p>You have successfully logged in.</p>
            <p>Your preparation journey continues.</p>

            <button onclick="location.href='samplefront.html'">
                Go to Home
            </button>
        </div>
    </div>

</body>
</html>
